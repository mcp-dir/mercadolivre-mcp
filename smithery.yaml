# Smithery configuration for Mercado Livre Vendedor
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_mercadolivre

name: mercadolivre-mcp
displayName: "Mercado Livre Vendedor"
description: >
  Mercado Livre (o maior marketplace da América Latina) via API oficial, perfil e reputação do vendedor, anúncios, pedidos, perguntas, envios (Mercado Envios), categorias e visitas, por OAuth 2.0. Somente leitura. Você cria o aplicativo no DevCenter do Mercado Livre e autoriza com OAuth.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/mercadolivre-mcp
repository: https://github.com/mcp-dir/mercadolivre-mcp

tags:
  - mercadolivre
  - brazil
  - ecommerce
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_mercadolivre

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_mercadolivre/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
